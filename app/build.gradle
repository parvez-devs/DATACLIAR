plugins { id 'com.android.application' }
def appVersion = new Properties()
file('version.properties').withInputStream { appVersion.load(it) }
android {
    namespace 'com.axiom.datacliar'
    compileSdk 35
    defaultConfig {
        applicationId 'com.axiom.datacliar'
        minSdk 26
        targetSdk 35
        versionCode (project.findProperty('versionCodeOverride') ?: appVersion.getProperty('versionCode')).toInteger()
        versionName (project.findProperty('versionNameOverride') ?: appVersion.getProperty('versionName'))
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { aidl true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; disable 'MissingTranslation', 'HardcodedText', 'SetTextI18n' }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
