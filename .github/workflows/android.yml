name: Android build and preview release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile, test and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Package preview
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DATACLIAR-1.0.0-preview.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DATACLIAR-preview
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
      - name: Publish installable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "DATACLIAR 1.0.0 Preview ${GITHUB_RUN_NUMBER}" --notes-file RELEASE_NOTES.md --prerelease
