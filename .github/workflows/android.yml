name: Android build and preview release
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile, test and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest :fixture:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: |
            screenshots/
            navigation-test.log
            control-smoke.log
      - name: Package preview
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DATACLIAR-1.2.0-shizuku-preview.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DATACLIAR-preview
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.html
      - name: Publish installable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "DATACLIAR 1.2.0 Shizuku Preview ${GITHUB_RUN_NUMBER}" --notes-file RELEASE_NOTES.md --prerelease
